name: Install locked Alibaba Cloud Terraform provider source
description: Serve the reviewed upstream Linux archive from a job-local Terraform mirror
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        test "$RUNNER_OS" = Linux
        test "$RUNNER_ARCH" = X64
        provider=registry.terraform.io/aliyun/alicloud
        package=terraform-provider-alicloud_1.293.0_linux_amd64.zip
        checksum=3a03af6d2b752601fee4a2384b3ff98548f7132265aaced9e4f9ccd2913fb73e
        grep -Fq "\"zh:$checksum\"" terraform-module/infra-api-read/.terraform.lock.hcl
        mirror=$(mktemp -d "$RUNNER_TEMP/alicloud-provider.XXXXXX")
        mkdir -p "$mirror/$provider"
        curl --disable --proto '=https' --proto-redir '=https' --retry 3 --retry-max-time 60 \
          --max-time 120 -fsSL -H 'Accept: application/octet-stream' \
          'https://api.github.com/repos/aliyun/terraform-provider-alicloud/releases/assets/569860142' \
          -o "$mirror/$provider/$package"
        printf '%s  %s\n' "$checksum" "$mirror/$provider/$package" | sha256sum -c -
        cat > "$mirror/terraform.rc" <<EOF
        provider_installation {
          filesystem_mirror {
            path    = "$mirror"
            include = ["$provider"]
          }
          direct {
            exclude = ["$provider"]
          }
        }
        EOF
        printf 'TF_CLI_CONFIG_FILE=%s/terraform.rc\n' "$mirror" >> "$GITHUB_ENV"
