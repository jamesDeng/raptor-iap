name: AgenticFS bootstrap offline checks

on:
  push:
    branches: [main]
    paths: ['tools/agenticfs_bootstrap/**', 'tests/**', '.github/workflows/agenticfs-bootstrap.yml']
  pull_request:
    branches: [main]
    paths: ['tools/agenticfs_bootstrap/**', 'tests/**', '.github/workflows/agenticfs-bootstrap.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned SDKs
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r tools/agenticfs_bootstrap/requirements.txt
      - name: Test without cloud credentials
        run: |
          .venv/bin/python -m unittest discover -s tests -v
          .venv/bin/python -m tools.agenticfs_bootstrap --help
