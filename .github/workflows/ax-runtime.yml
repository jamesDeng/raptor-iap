name: AX runtime
on:
  pull_request:
    branches: [main]
    paths: ['components/ax-runtime-bridge/**', 'third_party/ax/**', 'scripts/ecs_ax/**', '.github/workflows/ax-runtime.yml']
  push:
    branches: [main]
    paths: ['components/ax-runtime-bridge/**', 'third_party/ax/**', 'scripts/ecs_ax/**', '.github/workflows/ax-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.1'
      - run: scripts/ecs_ax/test-bridge.sh
