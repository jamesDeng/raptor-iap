name: Platform images
on:
  pull_request:
    branches: [main]
    paths: ['components/raptor/**', 'components/agent-gateway/**', 'scripts/rdev/check-platform-image.sh', '.github/workflows/platform-images.yml']
  push:
    branches: [main]
    paths: ['components/raptor/**', 'components/agent-gateway/**', 'scripts/rdev/check-platform-image.sh', '.github/workflows/platform-images.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: raptor
            context: components/raptor
          - component: gateway
            context: components/agent-gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          load: true
          push: false
          tags: platform-${{ matrix.component }}:check
      - name: Offline packaging and fail-closed checks
        env:
          COMPONENT: ${{ matrix.component }}
        run: scripts/rdev/check-platform-image.sh "platform-${COMPONENT}:check" "$COMPONENT"
