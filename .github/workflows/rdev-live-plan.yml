name: Rdev protected foundation plan
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rdev.ali-state
  cancel-in-progress: false
jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    environment: rdev.ali-apply
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6
        with:
          role-to-assume: ${{ vars.RDEV_APPLY_ROLE_ARN }}
          oidc-provider-arn: ${{ vars.RDEV_OIDC_PROVIDER_ARN }}
          audience: sts.aliyuncs.com
          role-session-expiration: 1800
          role-session-name: rdev-foundation-plan
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false
      - name: Generate and inspect private initial plan
        env:
          TF_IN_AUTOMATION: 'true'
          RDEV_APPLY_ROLE_ARN: ${{ vars.RDEV_APPLY_ROLE_ARN }}
          RDEV_STATE_BUCKET: ${{ vars.RDEV_STATE_BUCKET }}
          RDEV_LOCK_ENDPOINT: ${{ vars.RDEV_LOCK_ENDPOINT }}
        run: python3 scripts/rdev/live_plan.py
