name: Sandbox storage network offline checks

on:
  push:
    branches: [main]
    paths: ['infra-terraform/**', 'terraform-module/**', 'tools/agenticfs_bootstrap/**', 'tests/**', '.github/workflows/sandbox-storage-network.yml']
  pull_request:
    branches: [main]
    paths: ['infra-terraform/**', 'terraform-module/**', 'tools/agenticfs_bootstrap/**', 'tests/**', '.github/workflows/sandbox-storage-network.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TERRAFORM_BIN: terraform
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false
      - name: Validate and test without cloud credentials
        run: |
          terraform fmt -check -recursive infra-terraform terraform-module tests/fixtures
          for directory in terraform-module/sandbox-storage-network infra-terraform/environments/poc-sg-storage; do
            terraform -chdir="$directory" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$directory" validate
            terraform -chdir="$directory" test
          done
      - name: Verify Terraform output and bootstrap contracts
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r tools/agenticfs_bootstrap/requirements.txt
          .venv/bin/python -m unittest discover -s tests -v
