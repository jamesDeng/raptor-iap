name: Terraform AX sandbox retirement plan
on:
  pull_request:
    branches: [main]
    paths: ['infra-terraform/environments/rdev.ali/ax-sandbox/**', 'terraform-module/ax-sandbox/**', 'scripts/ax_sandbox/**', '.github/workflows/terraform-ax-retirement.yml']
permissions:
  contents: read
concurrency:
  group: ax-sandbox-retirement-plan
  cancel-in-progress: false
jobs:
  plan:
    if: github.event.pull_request.head.repo.full_name == github.repository
    environment: rdev.ali-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6
        with:
          role-to-assume: ${{ vars.RDEV_PLAN_ROLE_ARN }}
          oidc-provider-arn: ${{ vars.RDEV_OIDC_PROVIDER_ARN }}
          audience: sts.aliyuncs.com
          role-session-expiration: 1800
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false
      - name: Generate private plan
        env:
          TF_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          TF_SUMMARY_PATH: ${{ runner.temp }}/summary.md
        run: |
          python3 -m unittest discover -s scripts/ax_sandbox -v
          python3 scripts/ax_sandbox/retirement_plan.py
      - name: Post sanitized plan to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -f "$RUNNER_TEMP/summary.md" ]; then
            printf 'Sandbox retirement plan failed; private output withheld. Inspect the workflow checks.\n' > "$RUNNER_TEMP/summary.md"
          fi
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/summary.md"
