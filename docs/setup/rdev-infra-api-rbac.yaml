# Bind this role only to the verified RoleId of raptor-rdev-infra-read.
# The binding is generated privately after RAM role creation; no guessed subject.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: raptor-rdev-infra-discovery
rules:
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list]
