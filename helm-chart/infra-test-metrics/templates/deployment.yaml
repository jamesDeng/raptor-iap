apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .Release.Name }}-metrics}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ .Release.Name }}-metrics}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ .Release.Name }}-metrics}
      annotations:
        inventory-contract-revision: {{ .Values.inventoryRevision | quote }}
        config-checksum: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534}
      volumes:
        - name: config
          configMap: {name: {{ .Release.Name }}-metrics}
        - name: inventory
          configMap: {name: {{ .Values.inventoryConfigMapName | quote }}}
        - name: data
          emptyDir: {sizeLimit: 256Mi}
{{- if .Values.receiver.enabled }}
        - name: write-proxy-temp
          emptyDir: {sizeLimit: 16Mi}
{{- end }}
      containers:
        - name: prometheus
          image: {{ .Values.image | quote }}
{{- if .Values.receiver.enabled }}
          args:
            - --config.file=/config/prometheus.yml
            - --storage.tsdb.path=/data
            - --storage.tsdb.retention.time=2h
            - --storage.tsdb.retention.size=128MB
            - --web.enable-remote-write-receiver
{{- else }}
          args: ["--config.file=/config/prometheus.yml", "--storage.tsdb.path=/data", "--storage.tsdb.retention.time=2h", "--storage.tsdb.retention.size=128MB"]
{{- end }}
          ports: [{name: http, containerPort: 9090}]
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: inventory, mountPath: /inventory, readOnly: true}
            - {name: data, mountPath: /data}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /-/ready, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /-/healthy, port: http}, periodSeconds: 10}
          resources:
{{ toYaml .Values.resources | indent 12 }}
{{- if .Values.receiver.enabled }}
        - name: write-proxy
          image: {{ .Values.receiver.proxyImage | quote }}
          command: ["nginx", "-c", "/etc/raptor-write-proxy/nginx.conf", "-g", "daemon off;"]
          ports: [{name: write, containerPort: 8080}]
          volumeMounts:
            - {name: config, mountPath: /etc/raptor-write-proxy/nginx.conf, subPath: write-proxy.conf, readOnly: true}
            - {name: write-proxy-temp, mountPath: /tmp}
          securityContext: {runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
{{- end }}

