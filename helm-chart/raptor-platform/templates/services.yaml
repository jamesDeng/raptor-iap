{{- $revision := required "repository.revision must be a reviewed commit" .Values.repository.revision -}}
{{- if not (regexMatch "^[a-f0-9]{40}$" $revision) }}{{ fail "invalid repository revision" }}{{ end -}}
{{- range $name, $image := .Values.images -}}
{{- if not (regexMatch "^ghcr.io/jamesdeng/raptor-iap-(raptor|gateway)@sha256:[a-f0-9]{64}$" $image) }}{{ fail "published image digest required" }}{{ end -}}
{{- end -}}
{{- $services := list (dict "name" "raptor-frontend" "binary" "frontend" "port" 8870 "addr" "RAPTOR_FRONTEND_ADDR") (dict "name" "raptor-backend" "binary" "backend" "port" 8871 "addr" "RAPTOR_BACKEND_ADDR") (dict "name" "raptor-open-api" "binary" "open-api" "port" 8872 "addr" "RAPTOR_OPEN_API_ADDR") (dict "name" "raptor-admin" "binary" "admin" "port" 8873 "addr" "RAPTOR_ADMIN_ADDR") (dict "name" "agent-gateway" "binary" "gateway" "port" 8874 "addr" "GATEWAY_ADDR") -}}
{{ range $service := $services }}
{{ $code := required (printf "appCodes.%s must be generated by Raptor" $service.name) (index $.Values.appCodes $service.name) }}
{{ if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9_.-]{0,62}$" $code) }}{{ fail "invalid application code label" }}{{ end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $service.name }}
  labels:
    raptor.appcode: {{ $code | quote }}
    raptor.env: {{ $.Values.environment | quote }}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $service.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $service.name }}
        raptor.appcode: {{ $code | quote }}
        raptor.env: {{ $.Values.environment | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{ if eq $service.name "raptor-backend" }}
      initContainers:
        - name: repository
          image: {{ $.Values.images.raptor | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - git clone --no-checkout https://github.com/jamesDeng/raptor-iap.git /repo/source; git -C /repo/source checkout --detach "$SOURCE_REVISION"
          env:
            - name: SOURCE_REVISION
              value: {{ $revision | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
          volumeMounts:
            - {name: repository, mountPath: /repo}
            - {name: temporary, mountPath: /tmp}
      {{ end }}
      containers:
        - name: {{ $service.name }}
          image: {{ if eq $service.name "agent-gateway" }}{{ $.Values.images.gateway | quote }}{{ else }}{{ $.Values.images.raptor | quote }}{{ end }}
          command: [{{ printf "/usr/local/bin/%s" $service.binary | quote }}]
          ports:
            - {name: http, containerPort: {{ $service.port }}}
          env:
            - name: {{ $service.addr }}
              value: {{ printf "0.0.0.0:%d" ($service.port | int) | quote }}
            - {name: RAPTOR_BACKEND_URL, value: 'http://raptor-backend:8871'}
            - {name: RAPTOR_OPEN_API_URL, value: 'http://raptor-open-api:8872'}
            - {name: GATEWAY_URL, value: 'http://agent-gateway:8874'}
            - {name: RAPTOR_REPOSITORY, value: '/repo/source'}
            - {name: RAPTOR_SECURE_COOKIES, value: {{ $.Values.secureCookies | quote }}}
            - {name: RAPTOR_SIMULATION, value: 'false'}
            - {name: GATEWAY_SIMULATION, value: 'false'}
          {{ if or (eq $service.name "raptor-backend") (eq $service.name "raptor-open-api") (eq $service.name "agent-gateway") }}
          envFrom:
            - secretRef:
                name: {{ if eq $service.name "raptor-backend" }}raptor-runtime{{ else if eq $service.name "agent-gateway" }}gateway-runtime{{ else }}platform-service-auth{{ end }}
          {{ end }}
          startupProbe:
            tcpSocket: {port: http}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 40m, memory: 64Mi}
            limits: {cpu: 300m, memory: 256Mi}
          volumeMounts:
            - {name: temporary, mountPath: /tmp}
            {{ if eq $service.name "raptor-backend" }}
            - {name: repository, mountPath: /repo, readOnly: true}
            {{ end }}
      volumes:
        - name: temporary
          emptyDir: {sizeLimit: 64Mi}
        {{ if eq $service.name "raptor-backend" }}
        - name: repository
          emptyDir: {sizeLimit: 256Mi}
        {{ end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $service.name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $service.name }}
  ports:
    - {name: http, port: {{ $service.port }}, targetPort: http}
{{ end }}
