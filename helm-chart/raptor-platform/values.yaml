environment: rdev.ali
images:
  raptor: ''
  gateway: ''
repository:
  revision: ''
appCodes:
  raptor-frontend: ''
  raptor-backend: ''
  raptor-open-api: ''
  raptor-admin: ''
  agent-gateway: ''
# Explicit deployment policy, never inferred from untrusted forwarding headers.
secureCookies: false
publicFrontend: false

# Optional private caller credentials; backend only, never chart-supplied values.
infraReader:
  secretName: ''

# Secret references only; private values are supplied outside Git.
agentAccess:
  secretName: ''
  raptorMcpURL: https://api.rdev.raptor-iap.top/mcp
  infraMcpURL: https://infra-api.raptor-iap.top/mcp
gatewayLive:
  enabled: false
  serviceURL: ''
  configSecretName: ''
  credentialMode: static-sts
  rrsa:
    roleARN: ''
    providerARN: ''
  controllerSecretName: ''
  axTLSSecretName: ''

# Opt-in only after the Infra API route and scoped patch permission are ready.
directRestart:
  enabled: false

# Gateway may be enabled for private acceptance while Raptor admission stays off.
conversation:
  gatewayEnabled: false
  raptorEnabled: false
progress:
  publicURL: ''
  origins: ''
  connectOrigin: ''
