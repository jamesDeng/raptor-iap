# Publish only after certificate validation and authenticated platform acceptance.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: raptor-public-browser
  namespace: raptor-system
  annotations:
    konghq.com/protocols: https
    konghq.com/preserve-host: "true"
    konghq.com/strip-path: "false"
spec:
  ingressClassName: raptor-kong
  tls:
    - hosts: [raptor.rdev.raptor-iap.top]
      secretName: raptor-public-tls
  rules:
    - host: raptor.rdev.raptor-iap.top
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: raptor-frontend, port: {number: 8870}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: raptor-public-api
  namespace: raptor-system
  annotations:
    konghq.com/protocols: https
    konghq.com/preserve-host: "true"
    konghq.com/strip-path: "false"
    konghq.com/read-timeout: "120000"
spec:
  ingressClassName: raptor-kong
  tls:
    - hosts: [api.rdev.raptor-iap.top]
      secretName: raptor-public-tls
  rules:
    - host: api.rdev.raptor-iap.top
      http:
        paths:
          - path: /mcp
            pathType: Exact
            backend:
              service: {name: raptor-open-api, port: {number: 8872}}
          - path: /v1
            pathType: Prefix
            backend:
              service: {name: raptor-open-api, port: {number: 8872}}
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: private-management-only
  namespace: raptor-system
plugin: request-termination
config:
  status_code: 403
  message: PrivateManagementRequired
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: raptor-private-user-management
  namespace: raptor-system
  annotations:
    konghq.com/protocols: https
    konghq.com/plugins: private-management-only
    konghq.com/strip-path: "false"
spec:
  ingressClassName: raptor-kong
  tls:
    - hosts: [raptor.rdev.raptor-iap.top]
      secretName: raptor-public-tls
  rules:
    - host: raptor.rdev.raptor-iap.top
      http:
        paths:
          - path: /api/v1/users
            pathType: Prefix
            backend:
              service: {name: raptor-frontend, port: {number: 8870}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: raptor-private-environment-management
  namespace: raptor-system
  annotations:
    konghq.com/protocols: https
    konghq.com/plugins: private-management-only
    konghq.com/methods: POST,PATCH,PUT,DELETE
    konghq.com/strip-path: "false"
spec:
  ingressClassName: raptor-kong
  tls:
    - hosts: [raptor.rdev.raptor-iap.top]
      secretName: raptor-public-tls
  rules:
    - host: raptor.rdev.raptor-iap.top
      http:
        paths:
          - path: /api/v1/environments
            pathType: Prefix
            backend:
              service: {name: raptor-frontend, port: {number: 8870}}
          - path: /api/v1/environment-groups
            pathType: Prefix
            backend:
              service: {name: raptor-frontend, port: {number: 8870}}

---
# Request-bound tickets authorize this read-only WebSocket; no Gateway API prefix.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: raptor-request-progress
  namespace: raptor-system
  annotations:
    konghq.com/protocols: https
    konghq.com/methods: GET
    konghq.com/preserve-host: "true"
    konghq.com/strip-path: "false"
    konghq.com/read-timeout: "120000"
spec:
  ingressClassName: raptor-kong
  tls:
    - hosts: [raptor.rdev.raptor-iap.top]
      secretName: raptor-public-tls
  rules:
    - host: raptor.rdev.raptor-iap.top
      http:
        paths:
          - path: /v1/progress
            pathType: Exact
            backend:
              service: {name: agent-gateway, port: {number: 8874}}
