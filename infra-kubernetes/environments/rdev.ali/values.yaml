environment: rdev.ali
images:
  raptor: ghcr.io/jamesdeng/raptor-iap-raptor@sha256:f6f64dbb6c645ef42ca68542f3f9e17bb4fb4d29ff68e3842f797dfa834b2947
  gateway: ghcr.io/jamesdeng/raptor-iap-gateway@sha256:2a84d758c7aaea41ff4720eea519ca9136dbd369df8c318113918b886ec4a516
