  scope:
    envCode: rdev.ali
    proxyCode: DP00001
    groupId: asg-t4necb4dfmu6o3z2rn0g
    serverGroupId: sgp-xs5s42tihtl6ja2a67
    targetDbCode: D00002
    application:
      envCode: rdev.ali
