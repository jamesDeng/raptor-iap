environment: rdev.ali
images:
  raptor: ghcr.io/jamesdeng/raptor-iap-raptor@sha256:bccc310ac7611c008d7dafb9235cd112708015d486dee329979fc454863ad252
  gateway: ghcr.io/jamesdeng/raptor-iap-gateway@sha256:05517f7c21a23a8b5d5d588b6f7e5b1686fd966889eb1bc30806422b3630eab3
