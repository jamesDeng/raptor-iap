environment: rdev.ali
images:
  raptor: ghcr.io/jamesdeng/raptor-iap-raptor@sha256:8022777b0fd12e49c54919117cdf2c9497618bccfc34ec359b913c045dbd50e7
  gateway: ghcr.io/jamesdeng/raptor-iap-gateway@sha256:a3b3ec49447c3c2edd163d63d8de08eabf711c1c9ef3df2960f7f5369b501f2d
repository:
  revision: b57d043683d47ddf3ab2b4296db1c8adef6c6cab
appCodes:
  raptor-admin: A00006
  agent-gateway: A00005
  raptor-backend: A00001
  raptor-frontend: A00002
  raptor-open-api: A00004

secureCookies: true
publicFrontend: true

infraReader:
  secretName: infra-reader-auth

agentAccess:
  secretName: raptor-agent-introspection

# Four concurrent packaged observation processes share this container.
gatewayResources:
  requests: {cpu: 250m, memory: 64Mi}
  limits: {cpu: 1000m, memory: 256Mi}
gatewayLive:
  pgcatLoadBalancerHost: 'nlb-jqbxi42nurq0qkb7e9.ap-southeast-1.nlb.aliyuncsslbintl.com'
  enabled: true
  serviceURL: https://api.rdev.raptor-iap.top
  configSecretName: gateway-live-config
  credentialMode: rrsa
  controllerSecretName: ""
  rrsa:
    roleARN: acs:ram::1360282071200743:role/raptor-rdev-gateway-controller
    providerARN: acs:ram::1360282071200743:oidc-provider/ack-rrsa-c92787e953503492ea141a744c81498f1
  axTLSSecretName: gateway-ax-client-tls
  observer:
    enabled: true

# Validated Infra API route and two-target Kubernetes restart permission.
directRestart:
  enabled: true

# Same-session AX continuation accepted; messages still pass Raptor authorization.
conversation:
  gatewayEnabled: true
  raptorEnabled: true
modelProviders:
  enabled: true
  credentialKeySecretName: raptor-model-credential-key
githubPAT:
  enabled: true
  bucket: raptor-rdev-github-pat-1360282071200743
  roleARN: acs:ram::1360282071200743:role/raptor-rdev-github-pat-backend
  providerARN: acs:ram::1360282071200743:oidc-provider/ack-rrsa-c92787e953503492ea141a744c81498f1
  authSecretName: raptor-github-pat-auth
repositoryChange:
  enabled: true
progress:
  publicURL: wss://raptor.rdev.raptor-iap.top/v1/progress
  origins: https://raptor.rdev.raptor-iap.top
  connectOrigin: wss://raptor.rdev.raptor-iap.top

# Resource relationships are catalog settings; exact realization pins are request-owned.
